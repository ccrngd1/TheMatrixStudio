      <button class="btn primary full" data-a="asidesConsult:${run.id}">${ic('chat', 15)} Ask the consultant</button>`
  } else if (s.type === 'lib') {
    const p = DB.library[s.i]
    inner = `<div class="sh-h">${hx(p, 'lg')}<div class="grow"><div class="label">Archetype</div><b>${esc(p.name)}</b><div class="muted">${esc(p.role)}</div></div>${closeBtn}</div>
      <div class="card"><div class="label">Position</div><div class="big" style="font-size:15px">${esc(p.position)}</div></div>
      <div class="card" data-s="stopped"><span class="tag warn">Not yet qualified</span><div class="sm t2" style="margin-top:8px">A starting archetype. Measure it in a run before relying on it.</div></div>
      <button class="btn primary full" data-a="libUse:${s.i}">${ic('plus', 15)} Add to a new run</button>`
  } else if (s.type === 'hint') {
    inner = `<div class="sh-h"><div class="grow"><div class="label">Info</div></div>${closeBtn}</div><div style="font-size:14.5px;line-height:1.55">${esc(s.text)}</div><button class="btn full" data-a="close">Got it</button>`
  }
  return `<div class="scrim" data-a="close"></div><div class="sheet ${tall ? 'tall' : ''}">${inner}</div>`
}

const ANSWERS = {
  Analyst: [{ text: 'Lena never moved because her exit condition, a contract amendment, was never named in the room. Nobody offered it.', turns: [3, 8] },
    { text: 'The biggest gap: nobody priced the Friday escalation cover. Two personas assumed it was free.', turns: [7, 10] }],
  Persona: [{ text: 'Honestly? I would have moved if someone had put the exemption in writing. Nobody did.', turns: [6] }],
  Room: [{ text: 'The room agrees on a pilot but splits on who carries the risk. Three of five would sign today.', turns: [6, 10] }],
  Consultant: [{ text: 'My sources show off-peak discounts of 40–60% shifting about a fifth of deliveries [Road pricing handbook §4.2]. Year-one ridership is not in my sources.', turns: [] }],
}

// ─────────────────────────────── effects ───────────────────────────────
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789<>/=+*#'
function scramble(el) {
  const final = el.dataset.scramble, start = performance.now(), dur = 650
  const step = (now) => {
    const p = Math.min(1, (now - start) / dur), n = Math.floor(final.length * p)
    el.textContent = final.slice(0, n) + [...final.slice(n)].map((c) => (c === ' ' ? ' ' : GLYPHS[Math.floor(Math.random() * GLYPHS.length)])).join('')
    if (p < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}
// A new message types itself in. The untyped remainder stays in the DOM but invisible, so the
// bubble never changes height and the feed does not jump while it types.
function typeOut(el) {
  const full = el.textContent, start = performance.now(), dur = Math.min(1400, 300 + full.length * 14)
  const step = (now) => {
    const n = Math.floor(full.length * Math.min(1, (now - start) / dur))
    el.innerHTML = `${esc(full.slice(0, n))}<span style="opacity:0">${esc(full.slice(n))}</span>`
    if (n < full.length) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}
const rain = { ctx: null, w: 0, h: 0, drops: [], color: '#22d3ee', last: 0 }
function rainInit() {
  const c = document.getElementById('rain')
  let ctx = null
  try { ctx = c.getContext && c.getContext('2d') } catch { ctx = null }
  if (!ctx) return
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1)
  c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  Object.assign(rain, { ctx, w: r.width, h: r.height, drops: Array.from({ length: Math.ceil(r.width / 16) }, () => Math.floor(Math.random() * -60)),
    color: getComputedStyle(document.body).getPropertyValue('--rain').trim() || '#22d3ee' })
}
function rainFrame(t) {
  requestAnimationFrame(rainFrame)
  if (!S.fx || !rain.ctx || t - rain.last < 60) return
  rain.last = t
  const { ctx, w, h } = rain
  ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0, 0, w, h)
  ctx.globalCompositeOperation = 'source-over'; ctx.font = '13px ui-monospace,monospace'
  rain.drops.forEach((y, i) => {
    ctx.fillStyle = Math.random() > 0.95 ? '#ffffff' : rain.color
    ctx.fillText(GLYPHS[Math.floor(Math.random() * GLYPHS.length)], i * 16, y * 16)
    rain.drops[i] = y * 16 > h && Math.random() > 0.975 ? 0 : y + 1
  })
}
function boot() {
  const el = $('#boot')
  if (new URLSearchParams(location.search).has('noboot')) { el.remove(); return }
  const lines = ['linking persona agents', 'restoring checkpoints', 'arming cost meter', `${Object.values(DB.runs).filter(isLive).length} simulations live`]
  let i = 0
  const log = $('#bootlog')
  const tick = setInterval(() => { if (i < lines.length) log.innerHTML += `\u203a ${esc(lines[i++]).padEnd(26, '.')} <b>ok</b>\n` }, 260)
  const done = () => { clearInterval(tick); el.classList.add('out'); setTimeout(() => el.remove(), 460) }
  el.addEventListener('click', done)
  setTimeout(done, 1650)
}

// ─────────────────────────────── render ───────────────────────────────
let lastKey = null, lastSize = null
function render() {
  document.body.className = (S.mode === 'native' ? 'native' : S.mode === 'wide' ? 'wide' : 'framed') + (S.fx ? '' : ' nofx')
  if (document.body.dataset.theme !== S.theme) { document.body.dataset.theme = S.theme; rain.color = getComputedStyle(document.body).getPropertyValue('--rain').trim() }
  document.querySelectorAll('#devbar [data-a]').forEach((b) => {
    const [k, v] = b.dataset.a.split(':')
    b.classList.toggle('on', (k === 'mode' && v === S.mode) || (k === 'theme' && v === S.theme) || (k === 'fx' && S.fx))
  })
  const [r, a, b] = route()
  const key = location.hash
  const sc = document.getElementById('scroll')
  const prev = sc && { top: sc.scrollTop, atBottom: sc.scrollHeight - sc.scrollTop - sc.clientHeight < 60, key: sc.dataset.key }
  let html
  switch (r) {
    case 'run': html = vRun(a, b); break
    case 'new': html = vNew(a); break
    case 'ensemble': html = vEnsemble(a); break
    case 'ensembles': html = vEnsembles(); break
    case 'knowledge': html = vKnowledge(a); break
    case 'library': html = vLibrary(); break
    default: html = vRuns()
  }
  const view = $('#view')
  // Every looping animation is delayed by this, so a re-render resumes each loop in phase rather
  // than restarting it. All loop periods divide 12s.
  view.style.setProperty('--ph', `${-((performance.now() % 12000) / 1000).toFixed(3)}s`)
  view.innerHTML = html + sheetHtml() + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '')
  const n = document.getElementById('scroll')
  if (n) {
    n.dataset.key = key
    const isFeed = r === 'run' && (!b || b === 'conversation' || S.mode === 'wide')
    if (prev && prev.key === key) n.scrollTop = isFeed && prev.atBottom ? n.scrollHeight : prev.top
    else if (isFeed) n.scrollTop = n.scrollHeight
  }
  const na = document.getElementById('asideScroll')
  if (na) na.scrollTop = na.scrollHeight
  const titleKey = r + '/' + (a || '')
  if (titleKey !== lastKey) { lastKey = titleKey; document.querySelectorAll('.top [data-scramble]').forEach(scramble) }
  document.querySelectorAll('.msg.new .tt').forEach(typeOut)
  const size = S.mode + (S.fx ? 1 : 0)
  if (size !== lastSize) { lastSize = size; requestAnimationFrame(rainInit) }
}

// ─────────────────────────────── actions ───────────────────────────────
function getPath(path) { return path.split('.').reduce((o, k) => o?.[k], { draft: S.draft, run: DB.runs, q: S.q }) }
function setPath(path, val) {
  if (path === 'q') { S.q = val; return }
  const keys = path.split('.')
  const root = { draft: S.draft, run: DB.runs }
  let o = root
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]]
  o[keys.at(-1)] = val
}
function openSheet(s) { S.sheet = s; render() }

const A = {
  go: (p) => { S.sheet = null; go(p) },
  mode: (m) => { S.mode = m; S.sheet = null; render() },
  theme: (t) => { S.theme = t; render(); rainInit() },
  fx: () => { S.fx = !S.fx; render() },
  reset: () => { seed(); freshState(); go('runs'); toast('Prototype data reset') },
  toast: (...m) => toast(m.join(':')),
  filter: (k) => { S.filter = k; render() },
  newRun: () => { S.draft = blankDraft(); go('new/1') },
  newEnsemble: () => { S.draft = { ...blankDraft(), type: 'ensemble' }; go('new/1') },
  cancelNew: () => { S.draft = null; go('runs') },
  close: () => { S.sheet = null; render() },
  hint: (...t) => openSheet({ type: 'hint', text: t.join(':') }),
  stop: (id) => { DB.runs[id].status = 'stopping'; render() },
  resume: (id) => { const r = DB.runs[id]; if (!r.queue.length) r.queue = genQueue(r, 3); r.maxTurn = Math.max(r.maxTurn, r.turn + r.queue.filter((q) => !q.inject).length); r.status = 'running'; S.paused[id] = false; render() },
  pause: (id) => { S.paused[id] = !S.paused[id]; render() },
  step: (id) => { if (S.paused[id]) { advance(DB.runs[id]); render() } },
  speed: () => { S.speed = S.speed >= 4 ? 1 : S.speed * 2; render() },
  menu: (id) => openSheet({ type: 'menu', runId: id }),
  dossier: (id, key) => openSheet({ type: 'dossier', runId: id, key }),
  dtab: (t) => { S.sheet.tab = t; render() },
  cite: (id, n) => openSheet({ type: 'source', runId: id, n }),
  consult: (id) => openSheet({ type: 'consult', runId: id }),
  asidesConsult: (id) => { S.asides[id] = { ...(S.asides[id] || { msgs: [] }), target: 'Consultant' }; openSheet({ type: 'asides', runId: id }) },
  brief: (id) => openSheet({ type: 'brief', runId: id }),
  asides: (id) => openSheet({ type: 'asides', runId: id }),
  aTarget: (t) => { S.asides[S.sheet.runId].target = t; render() },
  aPersona: (k) => { S.asides[S.sheet.runId].persona = k; render() },
  askQuick: (...q) => { $('#asideInput').value = q.join(':'); A.askSend() },
  askSend: () => {
    const text = $('#asideInput').value.trim()
    if (!text) return
    const id = S.sheet.runId, run = DB.runs[id], st = S.asides[id]
    const pool = ANSWERS[st.target]
    const ans = pool[st.msgs.filter((m) => !m.me).length % pool.length]
    const from = st.target === 'Persona' ? run.agents[st.persona].name : st.target === 'Consultant' ? (run.consultant || 'Consultant') : st.target
    st.msgs.push({ me: true, text }, { pending: true })
    render()
    setTimeout(() => { st.msgs.pop(); st.msgs.push({ from, text: ans.text, turns: ans.turns.filter((t) => t <= run.turn) }); if (S.sheet?.type === 'asides') render() }, 1300)
  },
  jump: (id, t) => { S.sheet = null; go(`run/${id}/conversation`); setTimeout(() => document.getElementById('t' + t)?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 50) },
  promote: (id) => { S.sheet = null; branch(DB.runs[id], DB.runs[id].turn, 'Inject', 'Aside promoted into the room: the analyst notes the contract amendment was never offered.', 6) },
  genBrief: (id) => { DB.runs[id].brief = genericBrief(DB.runs[id]); toast('Summary generated'); },
  export: (id, fmt) => { download(DB.runs[id], fmt); toast(`Downloaded ${id}.${fmt === 'md' ? 'md' : 'html'}`) },
  share: (id) => { navigator.clipboard?.writeText(location.href).catch(() => {}); toast('Link copied (mock)') },
  freshFrom: (id) => {
    const r = DB.runs[id]
    S.draft = { ...blankDraft(), topic: r.topic, max: r.maxTurn, assumptions: [...r.assumptions], consultant: r.consultant,
      cast: Object.values(r.agents).map((a) => ({ name: a.name, role: a.role, position: a.position, firm: a.firm, exit: a.exit, withheld: a.withheld, wont: a.wont, cls: a.cls })) }
    S.sheet = null; go('new/5')
  },
  saveTemplate: () => { S.sheet = null; toast('Cast saved as a template') },
  forkAssume: (id, ...t) => openSheet({ type: 'fork', runId: id, turn: 1, kind: 'Assumption', text: t.join(':') + ' → ', budget: 8 }),
  assumeCard: (id) => { const r = DB.runs[id]; if (ended(r)) go(`run/${id}/analysis`); else toast(`Assumption: ${r.assumptions[0]} · fork it once the run ends`) },
  fork: (id) => openSheet({ type: 'fork', runId: id, turn: S.scrub[id] ?? Math.max(1, Math.round(DB.runs[id].turn / 2)), kind: 'Inject', text: '', budget: 8 }),
  forkKind: (k) => { S.sheet.text = $('#forkText').value; S.sheet.kind = k; render() },
  forkBudget: (n) => { S.sheet.text = $('#forkText').value; S.sheet.budget = Math.max(2, Math.min(24, S.sheet.budget + +n)); render() },
  createBranch: () => { const s = S.sheet; S.sheet = null; branch(DB.runs[s.runId], s.turn, s.kind, $('#forkText')?.value || s.text || '', s.budget) },
  scrubStep: (id, n) => { const r = DB.runs[id]; S.scrub[id] = Math.max(1, Math.min(r.turn, (S.scrub[id] ?? Math.round(r.turn / 2)) + +n)); render() },
  libPick: (i) => openSheet({ type: 'lib', i: +i }),
  libUse: (i) => { const p = DB.library[i]; if (!S.draft) S.draft = blankDraft(); S.draft.cast.push({ name: p.name, role: p.role, position: p.position, firm: 'soft', exit: '', withheld: '', wont: '', cls: p.cls }); S.sheet = null; go('new/2') },
  template: (k) => {
    const ags = Object.values(k === 'harbor' ? harborAgents() : robotAgents())
    S.draft = { ...(S.draft || blankDraft()), cast: ags.map((a) => ({ name: a.name, role: a.role, position: a.position, firm: a.firm, exit: a.exit, withheld: a.withheld, wont: a.wont, cls: a.cls })) }
    go('new/2'); toast('Template loaded')
  },
  newKb: () => { const id = 'kb' + Date.now(); DB.kbs.push({ id, name: 'New collection', scope: 'shared', docs: [], bound: [] }); go('knowledge/' + id) },
  // wizard
  set: (path, val) => { setPath(path, val); render() },
  toggle: (path) => { setPath(path, !getPath(path)); render() },
  inc: (path, n) => { const v = +getPath(path) + +n; setPath(path, Math.max(path.endsWith('cap') ? 0.5 : path.endsWith('reps') ? 1 : 2, Math.round(v * 100) / 100)); render() },
  openP: (i) => { S.draft.open = S.draft.open === +i ? null : +i; render() },
  addP: () => { S.draft.cast.push({ name: '', role: '', position: '', firm: 'soft', exit: '', withheld: '', wont: '', cls: CLS[S.draft.cast.length % 6] }); S.draft.open = S.draft.cast.length - 1; render() },
  rmP: (i) => { S.draft.cast.splice(+i, 1); S.draft.open = null; render() },
  addConsultant: () => { S.draft.consultant = 'Domain consultant'; render() },
  rmConsultant: () => { S.draft.consultant = null; render() },
  draftCast: () => { toast('Drafting a cast from the topic…'); setTimeout(() => { if (!S.draft) return; S.draft.cast = SAMPLE_CAST.map((p) => ({ ...p })); S.draft.open = null; render(); toast('5 personas drafted. Review them before launch') }, 1100) },
  importSample: () => { S.draft = { ...S.draft, topic: 'Should we move the support org to a four-day week?', cast: SAMPLE_CAST.map((p) => ({ ...p })), assumptions: ['Headcount stays flat'], max: 10 }; render(); toast('Imported sampleImport.json') },
  kbToggle: (id) => { const k = S.draft.kbs; k.includes(id) ? k.splice(k.indexOf(id), 1) : k.push(id); render() },
  addA: () => { const v = $('#newA').value.trim(); if (v) { S.draft.assumptions.push(v); render() } },
  rmA: (i) => { S.draft.assumptions.splice(+i, 1); render() },
  addS: () => { const v = $('#newS').value.trim(); if (v) { S.draft.scheduled.push({ text: v, after: Math.max(1, +$('#newSAfter').value || 1) }); render() } },
  rmS: (i) => { S.draft.scheduled.splice(+i, 1); render() },
  start: () => startFromDraft(),
}

function branch(parent, turn, kind, text, budget) {
  const id = codename()
  const msgs = parent.msgs.filter((m) => (m.inject ? m.after < turn : m.t <= turn)).map((m) => ({ ...m }))
  const run = mkRun({ id, topic: parent.topic, status: 'running', agents: JSON.parse(JSON.stringify(parent.agents)), msgs, parent: { id: parent.id, turn },
    cap: parent.cap, when: 'just now', assumptions: kind === 'Assumption' && text ? [text.split('→').pop().trim() || text] : [...parent.assumptions],
    sources: parent.sources, consultant: parent.consultant, model: parent.model })
  run.cost = 0
  const q = genQueue(run, budget)
  if (text && kind === 'Inject') q.unshift({ inject: 'Intervention', after: turn, text })
  if (text && kind === 'Cast') { run.agents.NEW = agent(text.replace(/^add\s+/i, '').slice(0, 40) || 'New persona', 'Joined at the fork', 'a6', { position: 'Arrives with fresh objections' }); q.splice(1, 0, { who: 'NEW', text: 'I have just joined. Before anything else, who has checked this with the people it affects?' }) }
  run.queue = q
  run.maxTurn = run.turn + q.filter((x) => !x.inject).length
  DB.runs[id] = run
  go(`run/${id}/conversation`)
  toast(`Branched ${id} from ${parent.id} @ turn ${turn}`)
}

function download(run, fmt) {
  const lines = run.msgs.map((m) => m.inject ? `> ✉ ${m.inject} (after turn ${m.after}): ${m.text}` : `**${run.agents[m.who].name}** (#${m.t}): ${m.text}`)
  const md = `# ${run.id}\n\n_${run.topic}_\n\n${run.brief ? `## Bottom line\n\n${run.brief.bottom}\n\n` : ''}## Transcript\n\n${lines.join('\n\n')}\n`
  const body = fmt === 'md' ? md : `<!doctype html><meta charset="utf-8"><title>${esc(run.id)}</title><body style="font-family:system-ui;max-width:700px;margin:40px auto">${md.split('\n\n').map((p) => `<p>${esc(p)}</p>`).join('')}</body>`
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([body], { type: fmt === 'md' ? 'text/markdown' : 'text/html' }))
  a.download = `${run.id}.${fmt === 'md' ? 'md' : 'html'}`
  a.click()
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]')
  if (!el || el.disabled) return
  const [act, ...args] = el.dataset.a.split(':')
  if (A[act]) { e.preventDefault(); A[act](...args) }
})
document.addEventListener('input', (e) => {
  const el = e.target
  if (el.id === 'scrub') {
    const run = DB.runs[el.dataset.run], t = +el.value
    S.scrub[run.id] = t
    $('#scrubT').textContent = 'Turn ' + t
    $('#forkT').textContent = t
    $('#scrubInfo').innerHTML = scrubInfo(run, t)
    return
  }
  const path = el.dataset.bind
  if (!path) return
  setPath(path, el.value)
  if (path === 'q') { render(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length) }
  else if (path.startsWith('draft.')) {
    const [lo, hi] = forecast(S.draft); const fc = $('#fc'); if (fc) fc.textContent = `≈ ${money(lo)}–${money(hi)}`
    const next = document.querySelector('[data-a="go:new/2"]'); if (next) next.disabled = !S.draft.topic.trim()
    if (el.tagName === 'SELECT') render()
  }
})
document.addEventListener('change', (e) => {
  const el = e.target
  if (el.dataset.upload) {
    const kb = DB.kbs.find((k) => k.id === el.dataset.upload)
    for (const f of el.files) kb.docs.push({ name: f.name, chunks: 0, pct: 5 })
    toast(`Indexing ${el.files.length} file${el.files.length === 1 ? '' : 's'}…`)
  }
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'asideInput') A.askSend()
  if (e.key === 'Enter' && e.target.id === 'newA') A.addA()
  if (e.key === 'Escape' && S.sheet) A.close()
})
window.addEventListener('resize', () => {
  if (window.innerWidth < 520 && S.mode !== 'native') S.mode = 'native'
  lastSize = null
  render()
})

seed()
freshState()
render()
boot()
requestAnimationFrame(rainFrame)
</script>
