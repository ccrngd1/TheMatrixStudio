# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-sim-studio"
version = "0.6.0"
description = "TheMatrix Simulation Studio - Multi-agent conversation simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "TheMatrix Simulation Studio Contributors"}
]
keywords = ["simulation", "multi-agent", "llm", "conversation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "litellm>=1.40.0",
    "boto3>=1.34.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Required by FastAPI to parse multipart bodies, i.e. any file upload. Core
    # rather than optional because uploading a .txt knowledge-base file needs no
    # other package, so making it an extra would gate the base case on an install
    # step for no reason.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    # httpx powers fastapi.testclient (used by the Phase 1 API/WS tests).
    "httpx>=0.27.0",
    # In-process AWS mocking for the Phase 2 storage port. `moto` rather than
    # DynamoDB Local because it needs no container, so the unit suite stays a
    # single `pytest` invocation. Verified to intercept boto3 calls made from
    # `asyncio.to_thread`, which is how the async storage layer talks to a sync
    # SDK without blocking the event loop.
    "moto[dynamodb,s3]>=5.0",
    # SRP sign-in for `scripts/verify_kb_retrieval.py`, which needs a real Cognito token
    # to exercise the deployed routes. SRP specifically: the admin password flow is not
    # enabled on the pool's client, and enabling it would widen the deployment's auth
    # surface permanently in order to run a verification.
    "pycognito>=2024.5.1",
]
# Phase 5 document retrieval reads PDF and Word attachments. Kept OPTIONAL so the
# base install stays light; .txt and .md attachments need nothing extra. Retrieval
# itself needs no package — embeddings live in S3 Vectors, reached through boto3, and
# the lexical arm is term matching over the stored text in process.
documents = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]
# The `vectors` extra held `sqlite-vec` and is GONE. Embeddings moved to S3 Vectors,
# which is an AWS API reached through boto3 — already a core dependency — so there is
# no package to install for vector retrieval any more. `aiosqlite` went with it: the
# SQLite storage layer was retained only to read a pre-migration `.db` file, and those
# 38 runs were dropped as test data on 2026-09-13.

[project.scripts]
matrix-studio = "matrix_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["matrix_studio*"]

[tool.setuptools.package-data]
# `public_figures.json` is read at run time by `real_names.py`; without it here an installed package (the
# Lambda image runs `pip install .`) would have no curated list, and every create would fail.
matrix_studio = ["static/**/*", "public_figures.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
